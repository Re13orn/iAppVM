name: iAppVM 问题报告
description: 报告构建、运行、签名或分析工具的问题
body:
  - type: input
    id: version
    attributes:
      label: iAppVM 版本或提交、设备和系统版本
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤、预期和实际结果
      description: 优先使用项目自带 Demo。提交前请移除日志中的账号、设备标识、认证头和密钥。
    validations:
      required: true
