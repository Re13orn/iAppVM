name: iAppVM build checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the host and Demo
        run: bash scripts/build-prototype.sh
      - name: Run local regressions
        run: bash scripts/run-regression.sh build/iOSVM-unsigned.ipa
